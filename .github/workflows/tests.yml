name: Sauce Demo UI Automation CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. تجهيز دبيئة الـ Java (JDK 21) نفس إصدار جهازك
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 4. تفعيل وضع الـ Headless إجباري على السيرفر لتشغيل المتصفح في الخلفية
      - name: Run Selenium Tests via Maven
        run: mvn test -Dheadless=true

      # 5. رفع نتائج Allure كـ Artifact عشان متضيعش بعد ما التست يخلص
      - name: Upload Allure Results
        if: always() # يشتغل حتى لو التستات سقطت عشان تشوف التقرير
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 5